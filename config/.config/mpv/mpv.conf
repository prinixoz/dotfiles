save-position-on-quit
speed=1
fullscreen

# Youtube Support
script-opts=ytdl_hook-ytdl_path=/usr/bin/yt-dlp
ytdl-format=bestvideo[height<=?720][fps<=?30][vcodec!=?vp9]+bestaudio/best


# --- Rendering (Wayland-friendly) ---
vo=gpu-next
gpu-context=wayland

# --- Smooth playback / fix jitter ---
video-sync=display-resample
interpolation=yes
tscale=oversample

# --- Hardware decoding (safe default) ---
hwdec=auto-safe

# --- Timing & buffering ---
profile=high-quality
vd-lavc-threads=0
cache=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=50MiB

# --- Reduce weird frame drops after focus/workspace switch ---
keep-open=yes
pause=no

# --- Optional: make behavior more stable on Wayland ---
opengl-early-flush=no

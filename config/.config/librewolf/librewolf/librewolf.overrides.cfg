// --- SET DEFAULT HOME PAGE & STRIP ALL CONTENT ---

// 1. Set Homepage and New Tabs to "Homepage (Default)"
defaultPref("browser.startup.page", 1);
defaultPref("browser.startup.homepage", "https://vimium.github.io/new-tab/");
defaultPref("browser.newtabpage.enabled", true);

// 2. Remove "Web Search" box
defaultPref("browser.newtabpage.activity-stream.showSearch", false);

// 3. Remove "Shortcuts" (Top Sites)
defaultPref("browser.newtabpage.activity-stream.feeds.topsites", false);

// 4. Remove "Recent activity" sections (Visited pages, Downloads)
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("browser.newtabpage.activity-stream.section.highlights.includeVisited", false);
defaultPref("browser.newtabpage.activity-stream.section.highlights.includeDownloads", false);

// 5. Move the sidebar to the right side
pref("sidebar.position_start", false);


defaultPref("browser.tabs.closeTabByDblclick", true);

// Allow userChrome.css customization
pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// Set startup page to a completely blank window
pref("browser.startup.page", 1);
pref("browser.startup.homepage", "about:blank");

// Set all new tabs to a completely blank page
pref("browser.newtaburl", "about:blank");
pref("browser.newtabpage.enabled", false);

pref("browser.download.autohideButton", true);

